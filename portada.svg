<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradientes de fondo y acento -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1712"/>
      <stop offset="50%" stop-color="#15241b"/>
      <stop offset="100%" stop-color="#09100c"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="100%" stop-color="#1b532f"/>
    </linearGradient>

    <!-- Sombra para la ventana de código -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Fondo -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Línea decorativa superior -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)"/>

  <!-- Llaves y símbolos de fondo difuminados -->
  <text x="50" y="580" font-family="monospace" font-size="160" font-weight="bold" fill="#2d8a4e" opacity="0.04">&lt;/&gt;</text>
  <text x="1050" y="200" font-family="monospace" font-size="220" font-weight="bold" fill="#2d8a4e" opacity="0.04">{ }</text>

  <!-- 2. Tarjeta IDE / Fragmento de Código (Derecha) -->
  <g transform="translate(640, 110)" filter="url(#card-shadow)">
    <!-- Marco de la ventana -->
    <rect width="490" height="430" rx="12" fill="#141c16" stroke="#254330" stroke-width="1.5"/>
    
    <!-- Barra superior del editor -->
    <rect width="490" height="38" rx="12" fill="#1b261f"/>
    <rect y="26" width="490" height="12" fill="#1b261f"/>
    
    <!-- Botones de control estilo macOS/IntelliJ -->
    <circle cx="22" cy="19" r="6" fill="#e05252"/>
    <circle cx="42" cy="19" r="6" fill="#e5c07b"/>
    <circle cx="62" cy="19" r="6" fill="#61afef"/>
    <text x="90" y="24" font-family="monospace" font-size="12" fill="#6b7280">App.java — CFGS DAM</text>

    <!-- Código fuente Java real -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" xml:space="preserve">
      <text x="25" y="75" fill="#c678dd">public class <tspan fill="#e5c07b">Main</tspan> {</text>
      
      <text x="50" y="105" fill="#c678dd">public static void <tspan fill="#61afef">main</tspan><tspan fill="#abb2bf">(String[] args) {</tspan></text>
      
      <text x="75" y="135" fill="#5c6370">// Inicializando entorno 0485</text>
      
      <text x="75" y="165" fill="#e5c07b">Curso <tspan fill="#abb2bf">dam = </tspan><tspan fill="#c678dd">new </tspan><tspan fill="#e5c07b">Curso</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#98c379">"Java LTS"</tspan><tspan fill="#abb2bf">);</tspan></text>
      
      <text x="75" y="195" fill="#abb2bf">dam.<tspan fill="#61afef">setIDE</tspan>(<tspan fill="#98c379">"IntelliJ IDEA"</tspan>);</text>
      <text x="75" y="225" fill="#abb2bf">dam.<tspan fill="#61afef">cargarModulos</tspan>(<tspan fill="#d19a66">14</tspan>);</text>
      
      <text x="75" y="265" fill="#c678dd">if <tspan fill="#abb2bf">(dam.</tspan><tspan fill="#61afef">isCompilado</tspan><tspan fill="#abb2bf">()) {</tspan></text>
      
      <text x="100" y="295" fill="#abb2bf">System.out.<tspan fill="#61afef">println</tspan>(<tspan fill="#98c379">"¡Hola Mundo!"</tspan>);</text>
      
      <text x="75" y="325" fill="#abb2bf">}</text>
      
      <text x="75" y="360" fill="#5c6370">/* Listo para ejecutar */</text>
      
      <text x="50" y="390" fill="#abb2bf">}</text>
      <text x="25" y="415" fill="#abb2bf">}</text>
    </g>
  </g>

  <!-- 3. Icono de Taza de Café Java (Vectorial elegante) -->
  <g transform="translate(100, 75)">
    <!-- Plato de la taza -->
    <ellipse cx="40" cy="62" rx="38" ry="6" fill="#1b532f" opacity="0.6"/>
    
    <!-- Cuerpo de la taza -->
    <path d="M 12 18 L 18 52 C 19 58 28 60 40 60 C 52 60 61 58 62 52 L 68 18 Z" fill="url(#cup-grad)"/>
    
    <!-- Asa de la taza -->
    <path d="M 64 24 C 76 24 76 44 63 46" fill="none" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Vapor sutil flotando -->
    <path d="M 28 12 C 25 6 32 3 28 -4" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 40 10 C 37 4 44 1 40 -6" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 52 12 C 49 6 56 3 52 -4" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 4. Textos Principales y Títulos (Izquierda) -->
  <!-- Tag Ciclo y Módulo -->
  <text x="100" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4ade80" letter-spacing="2.5">
    CFGS DAM • MÓDULO 0485
  </text>

  <!-- Título del Curso -->
  <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Programación
  </text>
  <text x="100" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#2d8a4e" letter-spacing="-0.5">
    en Java
  </text>

  <!-- Descripción corta -->
  <text x="100" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#9ca3af">
    Guía completa desde algoritmia hasta desarrollo modular.
  </text>

  <!-- Badges técnicos inferiores -->
  <g transform="translate(100, 465)">
    <!-- Badge Java LTS -->
    <rect x="0" y="0" width="140" height="38" rx="6" fill="#2d8a4e" fill-opacity="0.15" stroke="#2d8a4e" stroke-width="1.2"/>
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4ade80">☕ Java LTS</text>

    <!-- Badge IntelliJ IDEA -->
    <rect x="155" y="0" width="165" height="38" rx="6" fill="#2d8a4e" fill-opacity="0.15" stroke="#2d8a4e" stroke-width="1.2"/>
    <text x="173" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4ade80">💻 IntelliJ IDEA</text>

    <!-- Badge 14 Unidades -->
    <rect x="335" y="0" width="140" height="38" rx="6" fill="#2d8a4e" fill-opacity="0.15" stroke="#2d8a4e" stroke-width="1.2"/>
    <text x="353" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4ade80">📚 14 Unidades</text>
  </g>
</svg>
